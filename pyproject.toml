[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".dev-tools", ".review-baseline", "tmp*", "tools/_bj_decision_audit.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# These scripts add the project root before importing local modules.
"tools/*.py" = ["E402"]
"tests/test_control_panel.py" = ["E402"]
"tests/test_fishing_regressions.py" = ["E402"]
# Existing unused imports and ordering in the frozen cast implementation.
"bot/jobs/fisher.py" = ["F401"]
"bot/detectors/cast_timing.py" = ["I001"]

[tool.ruff.format]
# Verified in-game cast timing: keep these files byte-for-byte unchanged.
exclude = ["bot/detectors/cast_timing.py", "bot/jobs/fisher.py"]
